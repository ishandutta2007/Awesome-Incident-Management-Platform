<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Pulsing Alert Glow -->
    <radialGradient id="alertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Background Wave Lines -->
  <g opacity="0.25">
    <path d="M -100 200 Q 200 100 500 220 T 1100 180 T 1400 250" fill="none" stroke="#38bdf8" stroke-width="3">
      <animate attributeName="d" values="M -100 200 Q 200 100 500 220 T 1100 180 T 1400 250; M -100 180 Q 200 240 500 150 T 1100 220 T 1400 180; M -100 200 Q 200 100 500 220 T 1100 180 T 1400 250" dur="10s" repeatCount="indefinite" />
    </path>
    <path d="M -100 250 Q 300 280 700 120 T 1300 200" fill="none" stroke="#818cf8" stroke-width="2">
      <animate attributeName="d" values="M -100 250 Q 300 280 700 120 T 1300 200; M -100 220 Q 300 150 700 250 T 1300 180; M -100 250 Q 300 280 700 120 T 1300 200" dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Background Decorative Dynamic Cards/Graphs (Kept at sides/back to avoid obscuring text) -->
  <!-- Left Alert Card -->
  <g transform="translate(60, 60)">
    <rect width="200" height="90" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="30" cy="30" r="12" fill="url(#alertGlow)" />
    <circle cx="30" cy="30" r="5" fill="#ef4444" />
    <text x="52" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fca5a5">CRITICAL ALERT</text>
    <text x="30" y="65" font-family="monospace" font-size="11" fill="#cbd5e1">Service: PaymentGateway</text>
  </g>

  <!-- Right Metrics Card -->
  <g transform="translate(940, 60)">
    <rect width="200" height="90" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">MTTR REDUCTION</text>
    <text x="20" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#38bdf8">-64.5%</text>
    <!-- Mini Graph Bar -->
    <path d="M 130 65 L 145 55 L 160 60 L 185 38" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Central Header Text (Foreground, Unobstructed & Crisp) -->
  <g text-anchor="middle" transform="translate(600, 140)">
    <!-- Subtitle Badge -->
    <rect x="-160" y="-85" width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="-64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1">
      🚨 EHS &amp; IT OPERATIONAL ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Incident Management Platform
    </text>

    <!-- Description Subtitle -->
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated List of SaaS Solutions &amp; Open-Source Projects for Safety, Reliability &amp; On-Call
    </text>
  </g>

  <!-- Dynamic Incident Flow Pill Badges (Bottom Center) -->
  <g transform="translate(370, 240)">
    <!-- Detect -->
    <rect x="0" y="0" width="110" height="34" rx="17" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
    <text x="55" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fca5a5" text-anchor="middle">🔍 1. Detect</text>

    <path d="M 118 17 L 132 17" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Triage -->
    <rect x="140" y="0" width="110" height="34" rx="17" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="195" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fcd34d" text-anchor="middle">⚡ 2. Triage</text>

    <path d="M 258 17 L 272 17" stroke="#64748b" stroke-width="2" />

    <!-- Resolve -->
    <rect x="280" y="0" width="110" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="335" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7" text-anchor="middle">🛠️ 3. Resolve</text>

    <path d="M 398 17 L 412 17" stroke="#64748b" stroke-width="2" />

    <!-- Postmortem -->
    <rect x="420" y="0" width="125" height="34" rx="17" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <text x="482" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle">📘 4. Postmortem</text>
  </g>
</svg>
